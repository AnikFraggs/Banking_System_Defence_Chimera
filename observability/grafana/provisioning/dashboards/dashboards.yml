# Grafana dashboard provisioning for CHIMERA Checkout Shield. SANDBOX ONLY.
apiVersion: 1

providers:
  - name: chimera-checkout
    orgId: 1
    folder: CHIMERA
    type: file
    disableDeletion: false
    allowUiUpdates: true
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
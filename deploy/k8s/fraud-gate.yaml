# Fraud gate REST service. SANDBOX ONLY. UNTESTED.
# Image chimera-fraud-gate:local is a LOCAL BUILD tag. You MUST build and push it
# to a registry your cluster can pull from, then update image: below (e.g.
# <registry>/chimera-fraud-gate:<tag>). :local will not resolve in a cluster.
# Command/args mirror compose.yaml (uvicorn on port 8001, not the Dockerfile's
# default 8080).
#
# Readiness uses /ready, which returns 503 while the operator-supplied model
# artifact is absent. That is intentional fail-closed behavior: the pod stays
# NotReady and every score falls back to CHALLENGE. Liveness uses /openapi.json
# (always 200 once the app is up) so a missing model does NOT crash-loop the pod.
# /artifacts is an emptyDir here; supply the real model via a PVC, an init
# container, or a baked image before expecting CAPTURE.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-gate
  namespace: chimera
  labels:
    app: fraud-gate
    app.kubernetes.io/part-of: chimera-checkout-shield
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-gate
  template:
    metadata:
      labels:
        app: fraud-gate
        app.kubernetes.io/part-of: chimera-checkout-shield
    spec:
      containers:
        - name: fraud-gate
          image: chimera-fraud-gate:local # TODO: push to a registry and replace
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: chimera-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /openapi.json
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
      volumes:
        - name: artifacts
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-gate
  namespace: chimera
  labels:
    app: fraud-gate
    app.kubernetes.io/part-of: chimera-checkout-shield
spec:
  type: ClusterIP
  selector:
    app: fraud-gate
  ports:
    - name: http
      port: 8001
      targetPort: 8001
# Redis for CHIMERA Checkout Shield. SANDBOX ONLY. UNTESTED.
# Demo storage uses emptyDir (EPHEMERAL). For persistence use a StatefulSet +
# PVC. Image redis:7-alpine and appendonly command match compose.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: chimera
  labels:
    app: redis
    app.kubernetes.io/part-of: chimera-checkout-shield
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/part-of: chimera-checkout-shield
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: redisdata
              mountPath: /data
      volumes:
        - name: redisdata
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: chimera
  labels:
    app: redis
    app.kubernetes.io/part-of: chimera-checkout-shield
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
# Fraud gate gRPC transport. SANDBOX ONLY. UNTESTED.
# Image chimera-fraud-gate:local is a LOCAL BUILD tag; push to a registry and
# replace image: below before applying to a cluster.
# Command mirrors compose.yaml (python -m app.grpc_server). The gRPC server has
# no HTTP health endpoint, so probes use a TCP socket check on 50051. As with the
# REST service, an absent model artifact means fail-closed CHALLENGE scoring; the
# server still binds and serves, so TCP probes stay green.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-gate-grpc
  namespace: chimera
  labels:
    app: fraud-gate-grpc
    app.kubernetes.io/part-of: chimera-checkout-shield
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-gate-grpc
  template:
    metadata:
      labels:
        app: fraud-gate-grpc
        app.kubernetes.io/part-of: chimera-checkout-shield
    spec:
      containers:
        - name: fraud-gate-grpc
          image: chimera-fraud-gate:local # TODO: push to a registry and replace
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.grpc_server"]
          ports:
            - name: grpc
              containerPort: 50051
            - name: metrics
              containerPort: 8082
          env:
            - name: METRICS_PORT
              value: "8082"
          envFrom:
            - configMapRef:
                name: chimera-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
      volumes:
        - name: artifacts
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-gate-grpc
  namespace: chimera
  labels:
    app: fraud-gate-grpc
    app.kubernetes.io/part-of: chimera-checkout-shield
spec:
  type: ClusterIP
  selector:
    app: fraud-gate-grpc
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: metrics
      port: 8082
      targetPort: 8082
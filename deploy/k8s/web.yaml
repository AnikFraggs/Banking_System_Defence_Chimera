# web (React/Vite build served by nginx). SANDBOX ONLY. UNTESTED.
# Image chimera-checkout-web:local is a LOCAL BUILD tag; push to a registry and
# replace image: below before applying to a cluster.
# nginx listens on 80 (compose publishes it as host 5173). The bundled nginx.conf
# serves / and proxies /api/ to http://bff-express:5000, which resolves to the
# bff-express Service in this namespace (nginx exits at startup if that name does
# not resolve, so apply bff-express.yaml first). Probe path / matches the compose
# healthcheck. VITE_* values are build-time args baked into the image, not runtime
# env, so they are set when you build/push the image (see web/Dockerfile).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: chimera
  labels:
    app: web
    app.kubernetes.io/part-of: chimera-checkout-shield
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/part-of: chimera-checkout-shield
    spec:
      containers:
        - name: web
          image: chimera-checkout-web:local # TODO: push to a registry and replace
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: chimera
  labels:
    app: web
    app.kubernetes.io/part-of: chimera-checkout-shield
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
# ============================================================================
# DO NOT COMMIT REAL VALUES. This is an EXAMPLE template only.
# Copy to secret.yaml, replace every placeholder with a throwaway LOCAL/DEMO
# value, and keep secret.yaml out of version control (.gitignore).
# SANDBOX ONLY: never store real card data, real cardholder data, or real
# PayPal credentials here. PayPal fields stay empty unless an operator
# explicitly configures PayPal *sandbox* test accounts.
# UNTESTED: never applied to a cluster.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: chimera-secrets
  namespace: chimera
  labels:
    app.kubernetes.io/part-of: chimera-checkout-shield
type: Opaque
stringData:
  # Local demo database password. CHANGE ME. Must match POSTGRES_PASSWORD used
  # by the postgres Deployment and SPRING_DATASOURCE_PASSWORD used by platform-api.
  POSTGRES_PASSWORD: "CHANGE_ME_local_demo_password"
  SPRING_DATASOURCE_PASSWORD: "CHANGE_ME_local_demo_password"

  # Audit ledger HMAC key. Use a long random value for any persistent/shared
  # deployment; empty is allowed only for local ephemeral use. CHANGE ME.
  AUDIT_HMAC_KEY: "CHANGE_ME_long_random_hex_key"

  # Manager authorization key (local default is manager-local-key). CHANGE ME.
  MANAGER_AUTH_KEY: "CHANGE_ME_manager_key"

  # PayPal SANDBOX test-account credentials only. Leave empty for stub mode.
  # NEVER put real/production PayPal credentials here.
  PAYPAL_CLIENT_ID: ""
  PAYPAL_CLIENT_SECRET: ""
  PAYPAL_WEBHOOK_ID: ""
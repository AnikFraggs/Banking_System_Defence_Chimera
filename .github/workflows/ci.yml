name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Base URL of a deployed SANDBOX target for the manual k6 load test (e.g. http://localhost:8080). Never a production system."
        required: false
        default: ""
        type: string
      k6_script:
        description: "k6 script under loadtest/k6/ to run."
        required: false
        default: "checkout-load.js"
        type: choice
        options:
          - checkout-load.js
          - idempotency-duplicate.js
          - cache-hit.js

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java 21 Maven tests
    runs-on: ubuntu-latest
    env:
      PAYPAL_MODE: stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run multi-module Maven tests
        run: mvn -B --no-transfer-progress test

  fraud-gate:
    name: Python 3.12 fraud-gate tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fraud-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fraud-gate/requirements.txt
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt
      - name: Run pytest without a production model or credentials
        run: pytest -q

  web:
    name: React clean install and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CI: true
      VITE_API_URL: http://localhost:8080
      VITE_PAYPAL_STUB: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build without credentials
        run: npm run build

  docker-image:
    name: Docker image build (Maven multi-stage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build platform-api runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: chimera-platform-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-testcontainers:
    name: Java 21 integration (Testcontainers)
    runs-on: ubuntu-latest
    # Requires a Docker daemon for Testcontainers (ubuntu-latest runners ship
    # one). The -Pintegration Maven profile is added by the main agent; until it
    # exists this job can fail, so it is intentionally NON-BLOCKING.
    continue-on-error: true
    env:
      PAYPAL_MODE: stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run integration tests (Testcontainers, needs Docker)
        run: mvn -B --no-transfer-progress verify -Pintegration

  loadtest-k6:
    name: k6 load test (manual, deployed sandbox target)
    runs-on: ubuntu-latest
    # MANUAL ONLY: never runs on push/PR. Point it at a reachable SANDBOX target
    # via the TARGET_URL input. Thresholds in the scripts are TARGETS to be
    # measured, not pre-achieved results; this job can fail if they are not met.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Set up k6
        uses: grafana/setup-k6-action@v1
      - name: Run k6 against TARGET_URL
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          K6_SCRIPT: ${{ github.event.inputs.k6_script || 'checkout-load.js' }}
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "TARGET_URL input is required for the manual load test." >&2
            exit 1
          fi
          echo "Running loadtest/k6/$K6_SCRIPT against sandbox target $TARGET_URL"
          k6 run "loadtest/k6/$K6_SCRIPT"
